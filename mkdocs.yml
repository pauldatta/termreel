site_name: TermReel
site_description: Universal Terminal Recording & Video Synthesis Harness
site_author: Paul Datta
repo_name: pauldatta/termreel
repo_url: https://github.com/pauldatta/termreel
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - User Guides:
      - Zero-YAML Agent Synthesis: guides/zero-yaml-agents.md
      - Scenario Recipes & Templates: guides/recipes.md
      - Interactive AI Agents: interactive-agents.md
  - Architecture & Specifications:
      - System Overview: architecture.md
      - "SDD: Core Engine (TR-SDD-001)": SDD_TERMREEL.md
      - "SDD: Long-Running Resilience (TR-SDD-002)": SDD_LONG_RUNNING_RESILIENCE.md
  - CLI Reference: cli.md
  - Scenario Manifests: scenarios.md
  - CLI Explorer & Generator: generator.md
  - Themes & Customization: themes.md
  - Example Scenarios:
      - Antigravity AI Agent: examples/antigravity.md
      - Git Interactive Workflow: examples/git.md
      - Google Cloud SDK: examples/gcloud.md
      - Python REPL: examples/python.md
      - Matrix System HUD: examples/matrix.md
  - Contributing: contributing.md

