[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termreel"
version = "0.1.0"
description = "Universal Terminal Recording & Deterministic Video Synthesis Engine"
readme = "README.md"
authors = [
    { name = "Paul Datta", email = "pkdatta2000@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pycairo>=1.20.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
termreel = "termreel.cli:main"
reccli = "termreel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["termreel*"]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=7.0.0",
    "mkdocs-material>=9.0.0",
]
